name: Naukri Internships Scraper

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */3 * * *'  # This tells GitHub to run it every 3 hours
jobs:
  scrape-naukri:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # We are pinning playwright-stealth to 1.0.6 here to prevent the ImportError!
          pip install playwright beautifulsoup4 playwright-stealth==1.0.6
          playwright install chromium

      - name: Install Xvfb (Virtual Monitor)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Naukri Scraper with Virtual Display
        # xvfb-run creates the fake screen so headless=False doesn't crash the server
        env:
          PYTHONPATH: ${{ github.workspace }}
        
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scrapers/naukri_inp_scraper.py

      - name: Upload Error Screenshot
        # This step ONLY runs if the Python script crashes or times out
        if: failure() 
        uses: actions/upload-artifact@v4
        with:
          name: naukri-error-screenshot
          path: naukri_error_screenshot.png
          retention-days: 5

      - name: Commit and Push Scraped Data
        # Saves the generated CSV back into your repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/naukri_inp.csv
          
          # This checks if the CSV actually changed before trying to commit to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Naukri internships data" && git push)