name: Keep Render Alive

on:
  schedule:
    # This runs every 13 minutes (Render sleeps after 15)
    - cron: '*/13 * * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SmartIntern
        run: curl -s https://smartintern-sm9k.onrender.com > /dev/null