{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            
            <div class="card shadow-sm mb-5" style="border-radius: 12px;">
                <div class="card-header bg-white pt-4 pb-3 border-bottom-0">
                    <h3 class="mb-0">Edit Internship</h3>
                </div>
                <div class="card-body p-4 pt-0">

                    <form method="POST" action="{{ url_for('edit_internship', job_id=job['id']) }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Job Title / Role</label>
                                <input type="text" name="title" class="form-control" value="{{ job['title'] }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Location</label>
                                <input type="text" name="location" class="form-control" value="{{ job['location'] }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Duration</label>
                                <input type="text" name="duration" class="form-control" value="{{ job['duration'] if job['duration'] else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Stipend</label>
                                <input type="text" name="stipend" class="form-control" value="{{ job['stipend'] if job['stipend'] else '' }}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Required Skills (Comma separated)</label>
                            <input type="text" name="skills_final" class="form-control" value="{{ job['skills_final'] if job['skills_final'] else '' }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Application Link or Contact Email</label>
                            <input type="text" name="apply_link" class="form-control" value="{{ job['apply_link'] if job['apply_link'] else '' }}" required>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('employer_dashboard') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                        </div>
                    </form>
                    
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
